name: Sync Google Sheets Data & Deploy

on:
  schedule:
    # Run every 6 hours automatically (at minute 0)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Export optimized static files from Google Sheets
        run: node scripts/export_sheets.js

      - name: Commit and push updated static files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): auto-sync Google Sheets static files [skip ci]" && git push)
